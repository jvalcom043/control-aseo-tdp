  </style></head><body>  <h1>Control Aseo TDP</h1>  <div id="status">
    Pulsa «Activar cámara».
  </div>  <div id="cameraContainer"><video
  id="video"
  autoplay
  playsinline
  muted
></video>

<div id="scanBox"></div>

<div id="scanText">
  Coloca el QR dentro del recuadro
</div>

  </div>  <button id="startButton">
    📷 Activar cámara
  </button>
    <button id="manualButton">
  👤 Registro manual
</button>
  <div id="result"><div
  class="alumno"
  id="alumno"
></div>

<div
  class="grupo"
  id="grupo"
></div>

  </div><canvas id="canvas"></canvas>

<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const result =
  document.getElementById("result");

const alumnoElement =
  document.getElementById("alumno");

const grupoElement =
  document.getElementById("grupo");


let stream = null;

let scanning = false;

let procesandoQR = false;

let detector = null;


// ==========================================
// ACTIVAR CÁMARA
// ==========================================

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara() {

  try {

    status.textContent =
      "Solicitando acceso a la cámara...";


    // No forzamos resolución.
    // Dejamos que Android elija la adecuada.

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;


    await video.play();


    startButton.style.display =
      "none";


    // ======================================
    // INTENTAR DETECTOR NATIVO
    // ======================================

    if (
      "BarcodeDetector" in window
    ) {

      try {

        const formatos =
          await BarcodeDetector.getSupportedFormats();


        if (
          formatos.includes("qr_code")
        ) {

          detector =
            new BarcodeDetector({
              formats: ["qr_code"]
            });

          status.textContent =
            "📷 Cámara activa. Detector QR nativo preparado.";

        } else {

          status.textContent =
            "📷 Cámara activa. Usando lector alternativo.";

          detector = null;

        }

      } catch (e) {

        console.log(
          "BarcodeDetector no disponible:",
          e
        );

        detector = null;

      }

    } else {

      status.textContent =
        "📷 Cámara activa. Usando lector QR.";

    }


    scanning = true;

    scanQR();


  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ No se pudo abrir la cámara.";

  }

}


// ==========================================
// ESCANEO
// ==========================================

async function scanQR() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState ===
      video.HAVE_ENOUGH_DATA &&

    video.videoWidth > 0 &&

    !procesandoQR
  ) {


    // ======================================
    // MÉTODO 1: DETECTOR NATIVO
    // ======================================

    if (detector) {

      try {

        const resultados =
          await detector.detect(video);


        if (
          resultados &&
          resultados.length > 0
        ) {

          const texto =
            resultados[0].rawValue;


          if (texto) {

            procesarQR(texto);

            return;

          }

        }

      } catch (error) {

        console.log(
          "Error BarcodeDetector:",
          error
        );

      }

    }


    // ======================================
    // MÉTODO 2: jsQR
    // ======================================

    const maxWidth = 1000;


    const escala =
      Math.min(
        1,
        maxWidth / video.videoWidth
      );


    const width =
      Math.floor(
        video.videoWidth * escala
      );


    const height =
      Math.floor(
        video.videoHeight * escala
      );


    canvas.width = width;

    canvas.height = height;


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );


    const codigo =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (
      codigo &&
      codigo.data
    ) {

      procesarQR(
        codigo.data
      );

      return;

    }

  }


  setTimeout(
    function () {

      requestAnimationFrame(
        scanQR
      );

    },
    80
  );

}


// ==========================================
// PROCESAR QR
// ==========================================

function procesarQR(textoQR) {

  procesandoQR = true;


  console.log(
    "QR DETECTADO:",
    textoQR
  );


  const partes =
    String(textoQR)
      .split("|")
      .map(
        function (parte) {
          return parte.trim();
        }
      );


  const alumno =
    partes[0] || "";


  const grupo =
    partes[1] || "";


  if (!alumno) {

    status.textContent =
      "❌ QR sin nombre de alumno.";

    setTimeout(
      function () {

        procesandoQR = false;

        scanQR();

      },
      1500
    );

    return;

  }


  alumnoElement.textContent =
    "Alumno: " + alumno;


  grupoElement.textContent =
    "Grupo: " +
    (grupo || "No indicado");


  result.style.display =
    "block";


  status.textContent =
    "✅ QR DETECTADO";


  setTimeout(
    function () {

      result.style.display =
        "none";


      status.textContent =
        "📷 Buscando QR...";


      procesandoQR = false;


      scanQR();

    },
    2500
  );

}

const manualButton = document.getElementById("manualButton");

manualButton.addEventListener("click", function () {

  status.textContent = "⏳ Cargando alumnos...";

  const callbackName =
    "alumnosCallback_" + Date.now();

  window[callbackName] = function (respuesta) {

    delete window[callbackName];

    if (!respuesta || !respuesta.ok) {
      status.textContent = "❌ Error al cargar alumnos";
      return;
    }

    const alumnos = respuesta.alumnos || [];

    if (alumnos.length === 0) {
      status.textContent = "❌ No hay alumnos registrados";
      return;
    }

    let lista = "<h2>Selecciona un alumno</h2>";

    alumnos.forEach(function (nombre) {

      lista +=
        '<button class="alumnoManual" data-alumno="' +
        nombre.replace(/"/g, "&quot;") +
        '">' +
        nombre +
        "</button>";

    });

    result.innerHTML = lista;
    result.style.display = "block";

    document
      .querySelectorAll(".alumnoManual")
      .forEach(function (boton) {

        boton.addEventListener("click", function () {

          const alumno =
            this.getAttribute("data-alumno");

          result.innerHTML =
            "<div class='alumno'>Alumno: " +
            alumno +
            "</div>";

          status.textContent =
            "⏳ Consultando...";
const callbackConsulta =
  "consultaCallback_" + Date.now();

window[callbackConsulta] = function (respuesta) {

  delete window[callbackConsulta];

  if (!respuesta || respuesta.error) {
    status.textContent = "❌ Error en la consulta";
    return;
  }

  if (respuesta.puede) {

    result.innerHTML =
      "<div style='font-size:70px'>🟢</div>" +
      "<div style='font-size:28px;font-weight:bold'>" +
      "ACCESO PERMITIDO" +
      "</div>" +
      "<div>Alumno: " +
      respuesta.alumno +
      "</div>" +
      "<div>Usos hoy: " +
      respuesta.vecesHoy +
      "</div>";

    status.textContent = "✅ Puede acceder";

  } else {

    result.innerHTML =
      "<div style='font-size:70px'>🔴</div>" +
      "<div style='font-size:28px;font-weight:bold'>" +
      "ACCESO DENEGADO" +
      "</div>" +
      "<div>Alumno: " +
      respuesta.alumno +
      "</div>" +
      "<div>Usos hoy: " +
      respuesta.vecesHoy +
      "</div>";

    status.textContent = "⛔ No puede acceder";
  }

  result.style.display = "block";
};


const scriptConsulta =
  document.createElement("script");

scriptConsulta.src =
  "https://script.google.com/macros/s/AKfycby6HL3dAt2LOotmyveqTNQ1uq-gEdurRk6XhrbGYEHMcxv0d0R-9M8d0-_nqbaORndu/exec" +
  "?accion=consultar" +
  "&alumno=" +
  encodeURIComponent(alumno) +
  "&grupo=" +
  "&callback=" +
  callbackConsulta;

document.body.appendChild(scriptConsulta);

        });

      });

  };

  const script =
    document.createElement("script");

  script.src =
    "https://script.google.com/macros/s/AKfycbw3GuXbZgYv9VkaF_9GrFHzjSuSfH61yy7OkaL7vFhBNKL0ynQAW9AffQBWrg_wMDi4/exec" +
    "?accion=alumnos" +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);

});

</script></body>
