  <title>Control Aseo TDP</title>  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 15px 10px 5px;
      font-size: 24px;
    }

    #status {
      padding: 12px;
      font-size: 17px;
      min-height: 48px;
    }

    #cameraContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: auto;
      overflow: hidden;
      background: black;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    #scanBox {
      position: absolute;
      width: 75%;
      height: 40%;
      left: 12.5%;
      top: 30%;

      border: 3px solid white;
      border-radius: 15px;

      pointer-events: none;
    }

    #scanText {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 15px;

      font-size: 16px;
      text-shadow: 0 1px 3px black;
    }

    #startButton {
      padding: 14px 22px;
      font-size: 18px;

      border: none;
      border-radius: 10px;

      margin: 12px;

      cursor: pointer;
    }

    #result {
      display: none;

      margin: 20px;
      padding: 20px;

      border-radius: 15px;

      background: #222;
    }

    #result .alumno {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #result .grupo {
      font-size: 20px;
    }

    canvas {
      display: none;
    }

  </style></head><body>  <h1>Control Aseo TDP</h1>  <div id="status">
    Pulsa «Activar cámara».
  </div>  <div id="cameraContainer"><video
  id="video"
  autoplay
  playsinline
  muted
></video>

<div id="scanBox"></div>

<div id="scanText">
  Coloca el QR dentro del recuadro
</div>

  </div>  <button id="startButton">
    📷 Activar cámara
  </button>  <div id="result"><div
  class="alumno"
  id="alumno"
></div>

<div
  class="grupo"
  id="grupo"
></div>

  </div><canvas id="canvas"></canvas>

  <script>

    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );

    const status =
      document.getElementById("status");

    const startButton =
      document.getElementById("startButton");

    const result =
      document.getElementById("result");

    const alumnoElement =
      document.getElementById("alumno");

    const grupoElement =
      document.getElementById("grupo");


    let stream = null;

    let scanning = false;

    let procesandoQR = false;


    // ==========================================
    // ACTIVAR CÁMARA
    // ==========================================

    startButton.addEventListener(
      "click",
      async function () {

        try {

          status.textContent =
            "Solicitando acceso a la cámara...";


          stream =
            await navigator.mediaDevices.getUserMedia({

              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }

              },

              audio: false

            });


          video.srcObject = stream;


          await video.play();


          startButton.style.display =
            "none";


          status.textContent =
            "📷 Cámara activa. Buscando QR...";


          scanning = true;


          scanQR();


        } catch (error) {

          console.error(error);

          status.textContent =
            "❌ No se pudo abrir la cámara.";

        }

      }
    );


    // ==========================================
    // ESCANEO CONTINUO
    // ==========================================

    function scanQR() {

      if (!scanning) {
        return;
      }


      if (
        video.readyState ===
          video.HAVE_ENOUGH_DATA &&

        video.videoWidth > 0 &&

        !procesandoQR
      ) {


        // Reducimos la imagen para que el móvil
        // pueda analizarla rápidamente.

        const maxWidth = 800;


        const scale =
          Math.min(
            1,
            maxWidth / video.videoWidth
          );


        const width =
          Math.floor(
            video.videoWidth * scale
          );


        const height =
          Math.floor(
            video.videoHeight * scale
          );


        canvas.width = width;

        canvas.height = height;


        ctx.drawImage(
          video,
          0,
          0,
          width,
          height
        );


        const imageData =
          ctx.getImageData(
            0,
            0,
            width,
            height
          );


        // attemptBoth es más compatible
        // con distintos tipos de QR.

        const code =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );


        if (
          code &&
          code.data
        ) {

          procesarQR(
            code.data
          );

          return;

        }

      }


      // Aproximadamente 10 lecturas por segundo.

      setTimeout(
        function () {
          requestAnimationFrame(scanQR);
        },
        100
      );

    }


    // ==========================================
    // PROCESAR QR
    // ==========================================

    function procesarQR(textoQR) {

      procesandoQR = true;


      console.log(
        "QR detectado:",
        textoQR
      );


      const partes =
        String(textoQR)
          .split("|")
          .map(
            function (parte) {
              return parte.trim();
            }
          );


      const alumno =
        partes[0] || "";


      const grupo =
        partes[1] || "";


      if (!alumno) {

        status.textContent =
          "❌ El QR no contiene alumno.";


        setTimeout(
          function () {

            procesandoQR = false;

            scanQR();

          },
          1500
        );

        return;

      }


      alumnoElement.textContent =
        "Alumno: " + alumno;


      grupoElement.textContent =
        "Grupo: " +
        (grupo || "No indicado");


      result.style.display =
        "block";


      status.textContent =
        "✅ QR detectado";


      // Esperamos 2,5 segundos antes
      // de volver a buscar.

      setTimeout(
        function () {

          result.style.display =
            "none";


          status.textContent =
            "📷 Buscando QR...";


          procesandoQR = false;


          scanQR();

        },
        2500
      );

    }

  </script></body>
</html>
